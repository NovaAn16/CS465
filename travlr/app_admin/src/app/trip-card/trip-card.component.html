
<!-- Display one trip as a Bootstrap card -->

<div class="card h-100 shadow-sm">

  <div class="card-header">
    <h5 class="mb-0">{{ trip.name }}</h5>
  </div>

  <img
    src="assets/images/{{ trip.image }}"
    alt="{{ trip.name }}"
    class="card-img-top"
    style="height: 220px; object-fit: cover;">

  <div class="card-body">

    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} only {{ trip.perPerson }} per person
    </p>

    <div
      class="card-text"
      [innerHTML]="trip.description">
    </div>

  </div>

  <div class="card-footer bg-transparent">
    <button
      type="button"
      class="btn btn-info"
      (click)="editTrip(trip)">
      Edit Trip
    </button>
  </div>

</div>
