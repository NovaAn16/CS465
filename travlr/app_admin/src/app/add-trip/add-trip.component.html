
<div class="container mt-4 mb-5">

  <h2 class="mb-4">Add Trip</h2>

  <form
    *ngIf="addForm"
    [formGroup]="addForm"
    (ngSubmit)="onSubmit()">

    <!-- Trip Code -->
    <div class="mb-3">
      <label class="form-label">Trip Code</label>
      <input
        type="text"
        formControlName="code"
        class="form-control"
        placeholder="Example: TEST004">

      <div *ngIf="submitted && f['code'].errors"
           class="text-danger">
        Trip code is required.
      </div>
    </div>

    <!-- Trip Name -->
    <div class="mb-3">
      <label class="form-label">Trip Name</label>
      <input
        type="text"
        formControlName="name"
        class="form-control"
        placeholder="Trip name">

      <div *ngIf="submitted && f['name'].errors"
           class="text-danger">
        Trip name is required.
      </div>
    </div>

    <!-- Length -->
    <div class="mb-3">
      <label class="form-label">Length</label>
      <input
        type="text"
        formControlName="length"
        class="form-control"
        placeholder="Example: 4 days">

      <div *ngIf="submitted && f['length'].errors"
           class="text-danger">
        Trip length is required.
      </div>
    </div>

    <!-- Start Date -->
    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input
        type="date"
        formControlName="start"
        class="form-control">

      <div *ngIf="submitted && f['start'].errors"
           class="text-danger">
        Start date is required.
      </div>
    </div>

    <!-- Resort -->
    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input
        type="text"
        formControlName="resort"
        class="form-control"
        placeholder="Resort name">

      <div *ngIf="submitted && f['resort'].errors"
           class="text-danger">
        Resort is required.
      </div>
    </div>

    <!-- Price Per Person -->
    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input
        type="text"
        formControlName="perPerson"
        class="form-control"
        placeholder="Example: $800">

      <div *ngIf="submitted && f['perPerson'].errors"
           class="text-danger">
        Price is required.
      </div>
    </div>

    <!-- Image Filename -->
    <div class="mb-3">
      <label class="form-label">Image Filename</label>
      <input
        type="text"
        formControlName="image"
        class="form-control"
        placeholder="Example: reef1.jpg">

      <div *ngIf="submitted && f['image'].errors"
           class="text-danger">
        Image filename is required.
      </div>
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea
        formControlName="description"
        class="form-control"
        rows="4"
        placeholder="Enter trip description"></textarea>

      <div *ngIf="submitted && f['description'].errors"
           class="text-danger">
        Description is required.
      </div>
    </div>

    <!-- API Error Message -->
    <div *ngIf="errorMessage"
         class="alert alert-danger mt-3">
      {{ errorMessage }}
    </div>

    <!-- Save Button -->
    <button
      type="submit"
      class="btn btn-info"
      [disabled]="saving">

      {{ saving ? 'Saving Trip...' : 'Save Trip' }}

    </button>

  </form>

</div>
