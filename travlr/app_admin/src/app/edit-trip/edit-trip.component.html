
<div class="container mt-4 mb-5">

  <h2 class="mb-4">Edit Trip</h2>

  <div *ngIf="loading" class="alert alert-info">
    Loading trip information...
  </div>

  <div *ngIf="errorMessage"
       class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <form
    *ngIf="editForm && !loading && trip"
    [formGroup]="editForm"
    (ngSubmit)="onSubmit()">

    <!-- Trip Code -->
    <div class="mb-3">
      <label class="form-label">Trip Code</label>
      <input
        type="text"
        formControlName="code"
        class="form-control"
        readonly>

      <small class="text-muted">
        The trip code cannot be changed.
      </small>
    </div>

    <!-- Trip Name -->
    <div class="mb-3">
      <label class="form-label">Trip Name</label>
      <input
        type="text"
        formControlName="name"
        class="form-control">

      <div *ngIf="submitted && f['name'].errors"
           class="text-danger">
        Trip name is required.
      </div>
    </div>

    <!-- Length -->
    <div class="mb-3">
      <label class="form-label">Length</label>
      <input
        type="text"
        formControlName="length"
        class="form-control">

      <div *ngIf="submitted && f['length'].errors"
           class="text-danger">
        Trip length is required.
      </div>
    </div>

    <!-- Start Date -->
    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input
        type="date"
        formControlName="start"
        class="form-control">

      <div *ngIf="submitted && f['start'].errors"
           class="text-danger">
        Start date is required.
      </div>
    </div>

    <!-- Resort -->
    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input
        type="text"
        formControlName="resort"
        class="form-control">

      <div *ngIf="submitted && f['resort'].errors"
           class="text-danger">
        Resort is required.
      </div>
    </div>

    <!-- Price Per Person -->
    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input
        type="text"
        formControlName="perPerson"
        class="form-control">

      <div *ngIf="submitted && f['perPerson'].errors"
           class="text-danger">
        Price is required.
      </div>
    </div>

    <!-- Image Filename -->
    <div class="mb-3">
      <label class="form-label">Image Filename</label>
      <input
        type="text"
        formControlName="image"
        class="form-control">

      <div *ngIf="submitted && f['image'].errors"
           class="text-danger">
        Image filename is required.
      </div>
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea
        formControlName="description"
        class="form-control"
        rows="5"></textarea>

      <div *ngIf="submitted && f['description'].errors"
           class="text-danger">
        Description is required.
      </div>
    </div>

    <!-- Buttons -->
    <div class="d-flex gap-2">

      <button
        type="submit"
        class="btn btn-info"
        [disabled]="saving">

        {{ saving ? 'Saving...' : 'Save Changes' }}

      </button>

      <button
        type="button"
        class="btn btn-secondary"
        (click)="cancel()">

        Cancel

      </button>

    </div>

  </form>

</div>
